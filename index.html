<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hockey Darts - Rink Mentality Scoring</title>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #121a30;
            --bg-card: #1a2544;
            --accent-home: #3b82f6;
            --accent-away: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a3963;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-card);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .screen {
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Setup Screen */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-home);
        }

        .btn {
            background: var(--accent-home);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-away {
            background: var(--accent-away);
        }

        /* Scoreboard Screen */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            align-items: center;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .team-box.home { color: var(--accent-home); }
        .team-box.away { color: var(--accent-away); }

        .team-box h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .team-score {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .match-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-primary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .period-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .period-number {
            font-size: 1.25rem;
            font-weight: bold;
        }

        /* Turn Indicator */
        .turn-banner {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            border-left: 4px solid var(--accent-home);
        }

        .turn-banner.away-turn {
            border-left-color: var(--accent-away);
        }

        /* Throw Logger */
        .throw-log-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .throws-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .throw-slot {
            background: var(--bg-primary);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .throw-slot.filled {
            border-style: solid;
            border-color: var(--border-color);
            color: var(--text-main);
            background: var(--bg-card);
        }

        /* Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .key-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }

        .key-btn:hover {
            background: var(--border-color);
        }

        .key-btn.special {
            background: #253359;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Game Over Modal / Screen */
        .winner-banner {
            text-align: center;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .winner-banner h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HOCKEY DARTS</h1>
            <p>Fast Throws · Clean Scores · Rink Mentality</p>
        </header>

        <!-- SETUP SCREEN -->
        <div id="setup-screen" class="screen active">
            <div class="form-group">
                <label for="home-name">Home Team</label>
                <input type="text" id="home-name" value="Frost" placeholder="Enter Home Team">
            </div>
            <div class="form-group">
                <label for="away-name">Away Team</label>
                <input type="text" id="away-name" value="Blades" placeholder="Enter Away Team">
            </div>
            <button class="btn" onclick="startGame()">Start Match (Period 1)</button>
        </div>

        <!-- MATCH SCREEN -->
        <div id="match-screen" class="screen">
            <!-- Scoreboard -->
            <div class="scoreboard">
                <div class="team-box away">
                    <h3 id="display-away-name">Blades</h3>
                    <div class="team-score" id="away-score">0</div>
                </div>
                <div class="match-meta">
                    <span class="period-label">Period</span>
                    <span class="period-number" id="current-period">1</span>
                </div>
                <div class="team-box home">
                    <h3 id="display-home-name">Frost</h3>
                    <div class="team-score" id="home-score">0</div>
                </div>
            </div>

            <!-- Turn Banner -->
            <div id="turn-banner" class="turn-banner">
                <span id="turn-text">Home's Turn (Frost)</span>
            </div>

            <!-- Current Turn Throws -->
            <div class="throw-log-container">
                <label>Current Turn Throws</label>
                <div class="throws-display">
                    <div id="slot-0" class="throw-slot">-</div>
                    <div id="slot-1" class="throw-slot">-</div>
                    <div id="slot-2" class="throw-slot">-</div>
                </div>
            </div>

            <!-- Keypad for Throw Entry -->
            <div class="keypad">
                <button class="key-btn" onclick="recordThrow('20')">20</button>
                <button class="key-btn" onclick="recordThrow('19')">19</button>
                <button class="key-btn" onclick="recordThrow('18')">18</button>
                <button class="key-btn" onclick="recordThrow('17')">17</button>
                
                <button class="key-btn special" onclick="setMultiplier('T')">Triple</button>
                <button class="key-btn special" onclick="setMultiplier('D')">Double</button>
                <button class="key-btn" onclick="recordThrow('16')">16</button>
                <button class="key-btn" onclick="recordThrow('15')">15</button>

                <button class="key-btn special" onclick="setMultiplier('S')">Single</button>
                <button class="key-btn" onclick="recordThrow('Bull')">Bull</button>
                <button class="key-btn special" onclick="recordThrow('0')">Miss</button>
                <button class="key-btn special" onclick="clearCurrentThrow()">Undo</button>
            </div>

            <div class="action-row">
                <button class="btn btn-away" onclick="endTurn()">End Turn</button>
                <button class="btn" onclick="nextPeriod()">Next Period</button>
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameover-screen" class="screen">
            <div class="winner-banner">
                <h2 id="winner-title">Final Score</h2>
                <p id="winner-subtitle" style="color: var(--text-muted); margin-bottom: 15px;"></p>
                <button class="btn" onclick="resetGame()">New Match</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = {
            homeName: 'Frost',
            awayName: 'Blades',
            homeScore: 0,
            awayScore: 0,
            period: 1,
            isHomeTurn: true, // true = Home, false = Away
            currentThrows: [],
            multiplier: 'S' // S, D, T
        };

        function startGame() {
            const homeInput = document.getElementById('home-name').value.trim();
            const awayInput = document.getElementById('away-name').value.trim();

            if (homeInput) gameState.homeName = homeInput;
            if (awayInput) gameState.awayName = awayInput;

            document.getElementById('display-home-name').innerText = gameState.homeName;
            document.getElementById('display-away-name').innerText = gameState.awayName;

            switchScreen('match-screen');
            updateUI();
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function setMultiplier(type) {
            gameState.multiplier = type;
            // Visual feedback could be added here
        }

        function recordThrow(target) {
            if (gameState.currentThrows.length >= 3) return;

            let formattedThrow = target;
            if (target !== 'Bull' && target !== '0') {
                if (gameState.multiplier === 'T') formattedThrow = 'T' + target;
                else if (gameState.multiplier === 'D') formattedThrow = 'D' + target;
            } else if (target === 'Bull' && gameState.multiplier === 'D') {
                formattedThrow = 'DBull';
            }

            gameState.currentThrows.push({
                rawTarget: target,
                formatted: formattedThrow,
                points: calculatePoints(formattedThrow)
            });

            // Reset multiplier to single after throw
            gameState.multiplier = 'S';
            updateUI();
        }

        function calculatePoints(throwStr) {
            if (throwStr === '0') return 0;
            if (throwStr === 'Bull') return 25;
            if (throwStr === 'DBull') return 50;

            let mult = 1;
            let base = parseInt(throwStr.slice(1));
            if (throwStr.startsWith('T')) mult = 3;
            if (throwStr.startsWith('D')) mult = 2;

            return base * mult;
        }

        function clearCurrentThrow() {
            gameState.currentThrows.pop();
            updateUI();
        }

        function endTurn() {
            // Sum points for this turn
            const turnTotal = gameState.currentThrows.reduce((sum, t) => sum + t.points, 0);

            if (gameState.isHomeTurn) {
                gameState.homeScore += turnTotal;
            } else {
                gameState.awayScore += turnTotal;
            }

            // Reset turn
            gameState.currentThrows = [];
            gameState.isHomeTurn = !gameState.isHomeTurn;
            updateUI();
        }

        function nextPeriod() {
            if (gameState.period < 3) {
                gameState.period++;
                gameState.isHomeTurn = true; // Home starts new period
                gameState.currentThrows = [];
                updateUI();
            } else {
                showGameOver();
            }
        }

        function updateUI() {
            document.getElementById('home-score').innerText = gameState.homeScore;
            document.getElementById('away-score').innerText = gameState.awayScore;
            document.getElementById('current-period').innerText = gameState.period;

            // Turn Banner
            const banner = document.getElementById('turn-banner');
            const turnText = document.getElementById('turn-text');
            if (gameState.isHomeTurn) {
                banner.classList.remove('away-turn');
                turnText.innerText = `Home's Turn (${gameState.homeName})`;
            } else {
                banner.classList.add('away-turn');
                turnText.innerText = `Away's Turn (${gameState.awayName})`;
            }

            // Throws slots
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (gameState.currentThrows[i]) {
                    slot.innerText = gameState.currentThrows[i].formatted;
                    slot.classList.add('filled');
                } else {
                    slot.innerText = '-';
                    slot.classList.remove('filled');
                }
            }
        }

        function showGameOver() {
            switchScreen('gameover-screen');
            const title = document.getElementById('winner-title');
            const subtitle = document.getElementById('winner-subtitle');

            if (gameState.homeScore > gameState.awayScore) {
                title.innerText = `${gameState.homeName} Wins!`;
            } else if (gameState.awayScore > gameState.homeScore) {
                title.innerText = `${gameState.awayName} Wins!`;
            } else {
                title.innerText = `Regulation Tie!`;
            }
            subtitle.innerText = `Final Score — ${gameState.awayName}: ${gameState.awayScore} | ${gameState.homeName}: ${gameState.homeScore}`;
        }

        function resetGame() {
            gameState.homeScore = 0;
            gameState.awayScore = 0;
            gameState.period = 1;
            gameState.isHomeTurn = true;
            gameState.currentThrows = [];
            switchScreen('setup-screen');
        }
    </script>
</body>
</html>
