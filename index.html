<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hockey Darts - Rink Mentality Scoring</title>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #121a30;
            --bg-card: #1a2544;
            --accent-home: #3b82f6;
            --accent-away: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a3963;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-card);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .screen {
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Setup Screen */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-home);
        }

        .btn {
            background: var(--accent-home);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-away {
            background: var(--accent-away);
        }

        /* Scoreboard Screen */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            align-items: center;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .team-box.home { color: var(--accent-home); }
        .team-box.away { color: var(--accent-away); }

        .team-box h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .team-score {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .match-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-primary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .period-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .period-number {
            font-size: 1.25rem;
            font-weight: bold;
        }

        /* Turn Indicator */
        .turn-banner {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            border-left: 4px solid var(--accent-home);
        }

        .turn-banner.away-turn {
            border-left-color: var(--accent-away);
        }

        /* Throw Logger */
        .throw-log-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .throws-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .throw-slot {
            background: var(--bg-primary);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .throw-slot.filled {
            border-style: solid;
            border-color: var(--border-color);
            color: var(--text-main);
            background: var(--bg-card);
        }

        /* Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .key-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }

        .key-btn:hover {
            background: var(--border-color);
        }

        .key-btn.special {
            background: #253359;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1
